# Mirrors what was run locally on 2026-10-18; modeled on tokio's CI split.
name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo test --release --all-features --test alloc --test props
      - name: vectors are reproducible
        run: |
          cargo run -q --example vectors --features issue | cmp - vectors/v1.json
          cargo run -q --example agent --features issue | cmp - vectors/agent.json

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84
      - run: cargo check --lib --all-features

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: "miri, rust-src" }
      - run: cargo miri test --lib --all-features
      - run: cargo miri test --all-features --test vectors

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo rustc --lib --crate-type cdylib --profile wasm --target wasm32-unknown-unknown --features issue
      - name: no imports, vectors agree, fuel deterministic, memory flat
        working-directory: harness
        run: cargo run --release -- ../target/wasm32-unknown-unknown/wasm/kzp.wasm ../vectors

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install --locked cargo-fuzz
      - run: cargo fuzz run verify fuzz/corpus/verify -- -max_total_time=60
      - run: cargo fuzz run abi fuzz/corpus/abi -- -max_total_time=60
      - run: cargo fuzz run agent fuzz/corpus/agent -- -max_total_time=60

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
