# Continuation of .circleci/config.yml. Every job is always part of the `ci`
# workflow so `ci-summary` can be the one required check; with no code change
# each job finishes in seconds. See TESTING.md for what each check proves.
version: 2.1

parameters:
  code:
    type: boolean
    default: false

executors:
  stable:
    docker:
      # Pinned so a new stable's lints land in a deliberate bump, not a red PR.
      - image: cimg/rust:1.99
    resource_class: medium
    environment:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings

commands:
  only-if:
    description: Run `steps` when `condition` holds; otherwise finish immediately.
    parameters:
      condition:
        type: boolean
      steps:
        type: steps
    steps:
      - when:
          condition: << parameters.condition >>
          steps: << parameters.steps >>
      - unless:
          condition: << parameters.condition >>
          steps:
            - run:
                name: Nothing relevant changed
                command: echo "No code changes; skipping."

  cargo-cache:
    parameters:
      key:
        type: string
      steps:
        type: steps
    steps:
      - restore_cache:
          keys:
            - cargo-v1-<< parameters.key >>-{{ checksum "Cargo.lock" }}
            - cargo-v1-<< parameters.key >>-
      - steps: << parameters.steps >>
      - save_cache:
          key: cargo-v1-<< parameters.key >>-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ~/.cargo/bin/cargo-fuzz

  nightly:
    parameters:
      components:
        type: string
        default: ""
    steps:
      - run:
          name: Install nightly toolchain
          command: |
            components="<< parameters.components >>"
            rustup toolchain install nightly --profile minimal ${components:+--component "$components"}

jobs:
  # fmt, clippy, rustdoc and cargo-deny: the cheap gate everything else waits for.
  check:
    executor: stable
    steps:
      - only-if:
          condition: << pipeline.parameters.code >>
          steps:
            - checkout
            - cargo-cache:
                key: check
                steps:
                  - run: cargo fmt --check
                  - run: cargo clippy --all-features --all-targets
                  - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
            - run:
                name: cargo deny check
                command: |
                  version=0.20.2
                  curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz" \
                    | tar -xz --strip-components=1 -C /tmp "cargo-deny-${version}-x86_64-unknown-linux-musl/cargo-deny"
                  /tmp/cargo-deny check

  # Tests, reproducible vectors and the WebAssembly harness share one build cache.
  test:
    executor: stable
    steps:
      - only-if:
          condition: << pipeline.parameters.code >>
          steps:
            - checkout
            - cargo-cache:
                key: test
                steps:
                  - run: cargo test --all-features
                  - run: cargo test --release --all-features --test alloc --test props
                  - run:
                      name: vectors are reproducible
                      command: |
                        cargo run -q --example vectors --features issue | cmp - vectors/v1.json
                        cargo run -q --example agent --features issue | cmp - vectors/agent.json
                  - run: rustup target add wasm32-unknown-unknown
                  - run: cargo rustc --lib --crate-type cdylib --profile wasm --target wasm32-unknown-unknown --features issue
                  - run:
                      name: no imports, vectors agree, fuel deterministic, memory flat
                      working_directory: harness
                      command: cargo run --release -- ../target/wasm32-unknown-unknown/wasm/kzp.wasm ../vectors

  msrv:
    docker:
      - image: rust:1.84
    resource_class: small
    environment:
      RUSTFLAGS: -D warnings
    steps:
      - only-if:
          condition: << pipeline.parameters.code >>
          steps:
            - checkout
            - run: cargo check --lib --all-features

  # Unit tests and every ABI export under Miri: minutes, so it gates PRs.
  miri-lib:
    executor: stable
    steps:
      - only-if:
          condition: << pipeline.parameters.code >>
          steps:
            - checkout
            - nightly:
                components: miri,rust-src
            - cargo-cache:
                key: miri
                steps:
                  - run: cargo +nightly miri test --lib --all-features

  # All vectors with real Ed25519 under Miri takes ~15 minutes, and fuzzing is
  # open-ended exploration rather than a deterministic gate, so both run after
  # merge on main (and on any scheduled pipeline), not on every PR push.
  miri-vectors:
    executor: stable
    steps:
      - checkout
      - nightly:
          components: miri,rust-src
      - cargo-cache:
          key: miri
          steps:
            - run:
                command: cargo +nightly miri test --all-features --test vectors
                no_output_timeout: 30m

  fuzz:
    executor: stable
    environment:
      RUSTFLAGS: ""
    steps:
      - checkout
      - nightly
      - cargo-cache:
          key: fuzz
          steps:
            - run:
                name: Install cargo-fuzz
                command: command -v cargo-fuzz || cargo install --locked cargo-fuzz@0.13.2
            - run: cargo +nightly fuzz run verify fuzz/corpus/verify -- -max_total_time=60
            - run: cargo +nightly fuzz run abi fuzz/corpus/abi -- -max_total_time=60
            - run: cargo +nightly fuzz run agent fuzz/corpus/agent -- -max_total_time=60

  ci-summary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run: echo "All required CI jobs passed."

workflows:
  ci:
    jobs:
      - check
      - msrv
      - test:
          requires: [check]
      - miri-lib:
          requires: [check]
      - ci-summary:
          requires: [check, msrv, test, miri-lib]

  post-merge:
    when:
      or:
        - and:
            - << pipeline.parameters.code >>
            - equal: [main, << pipeline.git.branch >>]
        - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - miri-vectors
      - fuzz
