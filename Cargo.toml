[package]
name = "kaze"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Verifier for Kaze offers and accountable agent mandates"
readme = "README.md"
repository = "https://github.com/hiyoriOS/kaze"
keywords = ["agents", "sd-jwt", "jws", "payments", "protocol"]
categories = ["authentication", "cryptography", "wasm"]
# License not chosen yet; nothing is published until it is.
publish = false
include = ["/src", "/README.md", "/CHANGELOG.md"]

[lib]
# rlib for Rust users; cdylib is what the wasm32 build turns into kaze.wasm.
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Producing offers, attestations, mandates and presentations. Verifiers don't need it.
issue = []

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }

[[example]]
name = "vectors"
required-features = ["issue"]

[[bench]]
name = "verify"
harness = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# `cargo build --profile wasm --target wasm32-unknown-unknown` produces kaze.wasm.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
