[package]
name = "kzp"
version = "0.3.0"
edition = "2021"
rust-version = "1.84"
description = "Kaze protocol: platform-signed admission terms and accountable mandates for AI agents"
readme = "README.md"
repository = "https://github.com/hiyoriOS/kaze"
keywords = ["agents", "sd-jwt", "jws", "payments", "protocol"]
categories = ["authentication", "cryptography", "wasm"]
license = "Apache-2.0"
documentation = "https://docs.rs/kzp"
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["verify"]
# The verification exports of the WebAssembly ABI (`kzp_verify`, `kzp_verify_agent`, ...)
# and their JSON entry points in `abi`. The verifier itself is always compiled.
verify = []
# Signing requests and publishing the key directory (`sign`), and their ABI exports.
# Needs no Offer or mandate. `--no-default-features --features sign` is the small
# `kzp.wasm` that only signs.
sign = []
# Producing offers, attestations, mandates and presentations. Verifiers don't need it.
issue = ["sign"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sfv = "0.14.0"
sha2 = { version = "0.10", default-features = false }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }

[[example]]
name = "vectors"
required-features = ["issue"]

[[example]]
name = "agent"
required-features = ["issue"]

[[example]]
name = "sign"
required-features = ["sign"]

# Integration tests that call a feature's entry points need that feature.
[[test]]
name = "sign"
required-features = ["sign"]

[[test]]
name = "alloc"
required-features = ["verify"]

[[test]]
name = "props"
required-features = ["verify"]

[[bench]]
name = "verify"
harness = false
required-features = ["verify"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# `cargo build --profile wasm --target wasm32-unknown-unknown` produces kzp.wasm.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
